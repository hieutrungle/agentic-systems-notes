project:
  type: website
  output-dir: _site
  resources:
    - assets/animations/autoresearch-loop.mp4
    - assets/js/agent-fundamentals-animations.js
    - assets/js/agent-loop-animations.js
  render:
    - index.qmd
    - curriculum/*.qmd
    - literature/**/*.qmd
    - labs/*.qmd
    - exercises/*.qmd
    - case-studies/*.qmd

website:
  title: Agentic Systems
  page-navigation: true
  navbar:
    title: Agentic Systems
    collapse-below: xl
    left:
      - text: Curriculum
        href: curriculum/index.qmd
      - text: Literature
        href: literature/index.qmd
      - text: Labs
        href: labs/index.qmd
      - text: Design exercises
        href: exercises/index.qmd
      - text: AutoResearch
        href: case-studies/autoresearch.qmd
    right:
      - text: Hieu T. Le
        href: https://hieutrungle.github.io/
      - text: Blog
        href: https://hieutrungle.github.io/blog/
      - text: Learning
        href: https://hieutrungle.github.io/blog/learning/
  page-footer:
    left: "[← Back to Learning](https://hieutrungle.github.io/blog/learning/)"
    right: "[Source on GitHub](https://github.com/hieutrungle/agentic-systems-notes)"
  sidebar:
    - id: curriculum
      title: Curriculum
      style: docked
      contents:
        - section: Curriculum
          contents:
            - text: Overview
              href: curriculum/index.qmd
            # Quarto flattens a glob beginning with * inside the directory.
            - auto: "curriculum/*[0-9][0-9]-*.qmd"

bibliography: references.bib
execute:
  enabled: false
format:
  html:
    theme:
      light: [default, assets/theme/site.scss, assets/theme/light.scss]
      dark: [default, assets/theme/site.scss, assets/theme/dark.scss]
    respect-user-color-scheme: true
    include-in-header: assets/theme/head.html
    toc: true
    link-citations: true
